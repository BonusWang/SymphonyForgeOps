name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: forgeops_root_password
          MYSQL_DATABASE: forgeops
          MYSQL_USER: forgeops
          MYSQL_PASSWORD: forgeops_dev_password
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uforgeops -pforgeops_dev_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test backend
        working-directory: backend
        env:
          FORGEOPS_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3308/forgeops?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          FORGEOPS_DATASOURCE_USERNAME: forgeops
          FORGEOPS_DATASOURCE_PASSWORD: forgeops_dev_password
        run: mvn -B -Dmaven.repo.local=$HOME/.m2/repository test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose -f deploy/docker-compose.dev.yml config
      - name: Build Docker images
        run: docker compose -f deploy/docker-compose.dev.yml build
